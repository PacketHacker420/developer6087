name: Replace site with zip

# Put this file at: .github/workflows/replace-with-zip.yml
#
# How to use:
#   1. Upload your zip (e.g. yourboyglacier-site.zip) to the ROOT of the main branch.
#   2. Either push it (this workflow runs automatically on any new .zip at the root)
#      or go to Actions > "Replace site with zip" > Run workflow.
#   3. The workflow deletes everything in main (except .git and .github),
#      extracts the zip, deletes the zip, and commits the result.

on:
  workflow_dispatch:
    inputs:
      zip_name:
        description: "Zip file name at the repo root (leave empty to use the first .zip found)"
        required: false
        default: "yourboyglacier-site.zip"
  push:
    branches: [main]
    paths:
      - "*.zip"

permissions:
  contents: write

concurrency:
  group: replace-with-zip
  cancel-in-progress: false

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Wipe main and extract zip
        env:
          ZIP_INPUT: ${{ github.event.inputs.zip_name }}
        shell: bash
        run: |
          set -euo pipefail

          # 1. Find the zip
          if [ -n "${ZIP_INPUT:-}" ]; then
            ZIP="$ZIP_INPUT"
          else
            ZIP="$(ls -1 ./*.zip 2>/dev/null | head -n 1 || true)"
            ZIP="${ZIP#./}"
          fi

          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "::error::No zip found at the repo root (looked for: '${ZIP:-any .zip}')."
            exit 1
          fi
          echo "Using zip: $ZIP"

          # 2. Keep a copy outside the repo, then extract to a temp folder
          cp "$ZIP" /tmp/site.zip
          mkdir -p /tmp/extracted
          unzip -q /tmp/site.zip -d /tmp/extracted

          # 3. Delete everything in the repo except .git and .github
          #    (.github is kept so this workflow does not delete itself)
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            -exec rm -rf {} +

          # 4. Move the contents into the repo root.
          #    If the zip has a single top-level folder, flatten it.
          shopt -s dotglob nullglob
          TOP=(/tmp/extracted/*)
          if [ "${#TOP[@]}" -eq 1 ] && [ -d "${TOP[0]}" ]; then
            mv "${TOP[0]}"/* .
          else
            mv /tmp/extracted/* .
          fi

          # 5. Don't let a leftover .github from the zip overwrite this workflow
          #    (only matters if the zip itself contained .github; the kept one wins)
          git checkout -- .github 2>/dev/null || true

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Replace site contents from zip"
            git push origin main
          fi
